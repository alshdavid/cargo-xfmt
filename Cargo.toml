[package]
name = "cargo-xfmt"
version = "0.0.0-local"
edition = "2024"
authors = ["alshdavid"]
repository = "https://github.com/alshdavid/cargo-xfmt"
description = "Safely use nightly fmt options without using unstable Rust"
license = "MIT"

[lints.rust]
elided_lifetimes_in_paths = "allow"
rust_2018_idioms = { priority = -1, level = "deny" }

[lints.clippy]
module_inception = "allow"
uninlined_format_args = "allow"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
normalize-path = "0.2"
parking_lot = "0.13"
toml = "1"

[profile.release]
opt-level = 3
debug = false
lto = true
strip = "debuginfo"
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false
